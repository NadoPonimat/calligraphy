:root{--paper:#f6f1e4;--ink:#1d1a2b;--line:#c9bfa6;--panel:#ebe4d2;--accent:#3b2f8f;--muted:#6d6652}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--ink);background:transparent;font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper)}
textarea{width:100%;min-height:140px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fffdf7;font:16px/1.4 system-ui;resize:vertical}
.count{font-size:13px;color:var(--muted);text-align:right;margin:2px 0 10px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--panel);padding:12px;border-radius:8px;margin-bottom:14px}
.ctl label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.ctl select,.ctl input[type=range]{width:100%}
.ctl select{padding:8px;font:inherit;border-radius:6px;border:1px solid var(--line);background:#fffdf7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 14px;border:0;background:var(--accent);color:#fff;border-radius:8px;font:inherit;cursor:pointer}
.sheet{background:#fffdf7;border:1px solid var(--line);border-radius:4px;padding:28px 24px;margin-top:14px;box-shadow:0 1px 0 var(--line)}
#out{white-space:pre-wrap;word-wrap:break-word;font-variant-ligatures:common-ligatures contextual;font-kerning:normal;letter-spacing:0;text-rendering:optimizeLegibility;font-feature-settings:"liga" 1,"calt" 1,"kern" 1}
.sheet.guides{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#d9cfb6 calc(var(--lh) - 1px),#d9cfb6 var(--lh));background-position:0 28px}

.ai{background:var(--panel);padding:12px;border-radius:8px;margin-top:14px;display:grid;gap:10px}
.ai label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.ai input,.ai select{padding:8px;font:inherit;border-radius:6px;border:1px solid var(--line);background:#fffdf7}
.ai .st{font-size:13px;color:var(--muted)}
.sen{margin:0 0 18px}
.sen .ru,.sen details{font:16px/1.45 system-ui,sans-serif;color:#33405a}
.sen .ru{margin-top:4px}
.sen details{margin-top:4px;color:var(--muted);font-size:14px}
.sen summary{cursor:pointer;color:var(--accent)}
@media print{body{background:#fff}.wrap>*:not(.sheet){display:none}.sheet{border:0;box-shadow:0;margin:0;padding:0}}

<div class="ctl">
<label>Шрифт<select id="font"></select></label>
<label>Размер: <b id="sv"></b><input type="range" id="size" min="18" max="90" value="36"></label>
<label>Межстрочный интервал: <b id="lv"></b><input type="range" id="lh" min="1.2" max="3" step="0.1" value="1.8"></label>
<label>Наклон (только вид)<select id="skew"><option value="0">Как в шрифте</option></select></label>
<div class="row"><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="gd"> Линейки</label>
<button class="btn" id="pr">Печать / PDF</button></div>
</div>
<div class="ai">
<b>Перевод и разбор грамматики (ИИ)</b>
<label>API-ключ Gemini (хранится только в твоём браузере)<input type="password" id="key" placeholder="AIza..." autocomplete="off"></label>
<label>Модель<select id="model"><option value="gemini-2.5-flash">Gemini 2.5 Flash — стабильная</option><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite — быстрее</option><option value="gemini-3.5-flash">Gemini 3.5 Flash — новее</option></select></label>
<div class="row"><button class="btn" id="an">Перевести и разобрать</button><span class="st" id="st"></span></div>
</div>
<div class="sheet" id="sh"><div id="out"></div></div>
</div>
<script>
const FONTS={
 A:[["Caveat","Caveat (как в образце)"],["Kalam","Kalam"],["Sacramento","Sacramento"]],
 R:[["Pinyon Script","Pinyon Script (как в образце)"],["Great Vibes","Great Vibes"],["Italianno","Italianno"]]
};
const $=id=>document.getElementById(id);
let mode='A';
function fill(){
 $('font').innerHTML=FONTS[mode].map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('');
 $('tA').classList.toggle('on',mode=='A');$('tR').classList.toggle('on',mode=='R');
 $('size').value=mode=='A'?32:44;
 render();
}
function render(){
 const t=$('in').value,o=$('out');
 const showA=A&&A.text===t;
 if(showA){renderA(o)}else{o.style.whiteSpace='';o.textContent=t}
 const s=+$('size').value,l=+$('lh').value;
 o.style.fontFamily=`'${$('font').value}',cursive`;
 o.style.fontSize=s+'px';o.style.lineHeight=l;
 $('sv').textContent=s+' px';$('lv').textContent=l;
 const sh=$('sh');sh.style.setProperty('--lh',(s*l)+'px');
 sh.classList.toggle('guides',$('gd').checked&&!showA);
 $('cnt').textContent=t.length.toLocaleString('ru')+' символов';
 if(/[а-яё]/i.test(t))$('cnt').textContent+=' · кириллица в этих шрифтах не поддерживается';
}
$('tA').onclick=()=>{mode='A';fill()};$('tR').onclick=()=>{mode='R';fill()};
['in','font','size','lh','gd'].forEach(i=>$(i).addEventListener('input',render));
$('pr').onclick=()=>print();
$('skew').parentElement.remove();

let A=null;
try{$('key').value=localStorage.getItem('ak')||''}catch(e){}
$('key').addEventListener('change',()=>{try{localStorage.setItem('ak',$('key').value.trim())}catch(e){}});
function renderA(o){
 o.textContent='';o.style.whiteSpace='normal';
 A.items.forEach(it=>{
  if(it.br){const s=document.createElement('div');s.style.height='.6em';o.appendChild(s);return}
  const d=document.createElement('div');d.className='sen';
  const e=document.createElement('div');e.textContent=it.en;
  const r=document.createElement('div');r.className='ru';r.textContent=it.ru||'…';
  d.append(e,r);
  if(it.gr){const g=document.createElement('details');const s=document.createElement('summary');s.textContent='Почему так';const p=document.createElement('div');p.textContent=it.gr;g.append(s,p);d.appendChild(g)}
  o.appendChild(d)});
}
function split(t){
 const out=[];
 t.split(/\n+/).forEach(p=>{
  if(!p.trim())return;
  if(out.length)out.push({br:1});
  (p.match(/[^.!?]+(?:[.!?]+["”’')]*|$)\s*/g)||[]).forEach(s=>{s=s.trim();if(s)out.push({en:s})});
 });
 return out;
}
const SYS="Ты преподаватель английского для русскоязычного ученика. Тебе дают JSON-массив английских предложений. Верни ТОЛЬКО JSON-массив той же длины, без пояснений и без markdown. Каждый элемент: {\"ru\":\"естественный русский перевод\",\"gr\":\"разбор по-русски в 2-4 коротких предложениях\"}. В разборе объясни, ПОЧЕМУ предложение построено так: время и форма глагола, структура и порядок слов, значимые конструкции и предлоги, разговорные отступления от нормы (если есть, скажи, как было бы по строгой грамматике). Не пересказывай очевидное.";
async function analyze(){
 const t=$('in').value,key=$('key').value.trim(),st=$('st');
 if(!t.trim()){st.textContent='Сначала вставь текст.';return}
 if(!key){st.textContent='Вставь API-ключ.';return}
 try{localStorage.setItem('ak',key)}catch(e){}
 const items=split(t);A={text:t,items};render();
 const todo=items.filter(i=>i.en),B=8;
 $('an').disabled=true;
 for(let i=0;i<todo.length;i+=B){
  const part=todo.slice(i,i+B);
  st.textContent=`Обработано ${i} из ${todo.length}…`;
  try{
   const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+$('model').value+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:[{role:'user',parts:[{text:JSON.stringify(part.map(p=>p.en))}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2,maxOutputTokens:8192}})});
   const j=await r.json();
   if(!r.ok)throw new Error(j.error&&j.error.message||('HTTP '+r.status));
   const cand=j.candidates&&j.candidates[0];
   if(!cand||!cand.content)throw new Error('пустой ответ модели, попробуй ещё раз');
   const txt=cand.content.parts.map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
   const arr=JSON.parse(txt);
   if(!Array.isArray(arr)||arr.length!==part.length)throw new Error('ответ в неверном формате, попробуй ещё раз');
   part.forEach((p,k)=>{p.ru=arr[k].ru;p.gr=arr[k].gr});
   render();
  }catch(e){st.textContent='Ошибка: '+e.message;$('an').disabled=false;return}
 }
 st.textContent='Готово.';$('an').disabled=false;
}
$('an').onclick=analyze;
window.onbeforeprint=()=>document.querySelectorAll('details').forEach(d=>d.open=true);
fill();
</script></body></html>
